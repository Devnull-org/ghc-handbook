name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment, and let a newer push supersede an in-flight
# one rather than queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Explicitly NOT the GHC submodule. The whole point of committing
          # data/ is that the site builds from it alone — no GHC, no GHC source.
          # Checking it out would pull a very large tree to be ignored.
          submodules: false

      # Creates the Pages site if it does not exist yet; a no-op once it does.
      # Without a Pages site, the build succeeds and uploads its artifact but the
      # deploy job fails with a bare 404 from the deployment API, which reads as
      # a build problem and is not one.
      #
      # Org policy can still forbid a workflow token from enabling Pages. If this
      # step 404s, enable it by hand once:
      #   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The extractor is pure and its output is committed, so it is unit-tested
      # here rather than re-run: a regression in Note parsing would otherwise
      # only surface the next time someone regenerated by hand.
      - name: Test the Note extractor
        run: npm test

      # No GHC and no GHC checkout on the runner. If the build needs either,
      # that is a bug in the build, and this is where it shows up.
      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
